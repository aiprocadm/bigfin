# Сжатие ответов стенда bigfin. Кладётся в /etc/nginx/snippets/ и подключается
# строкой `include snippets/bigfin-gzip.conf;` внутри блока server сайта
# (ops/stand/enable-gzip.sh делает это сам). См. docs/RUNBOOK_TEST_STAND.md.
#
# Зачем. В общем nginx.conf стоит `gzip on`, но список типов закомментирован,
# а по умолчанию nginx сжимает ТОЛЬКО text/html. Скрипты и стили витрины
# уходили как есть: 4,9 МБ при первом входе и после каждого обновления стенда
# (у файлов меняются имена — старый кеш браузера не подходит). Со сжатием —
# около 1,3 МБ, то есть в 3,5–4 раза меньше.
#
# Настройки только для этого сайта — соседние сайты на сервере не затронуты.

gzip on;
# Кешам по пути: ответ бывает сжатым и несжатым, хранить нужно оба.
gzip_vary on;
# Ответы сервера приложения (/api) идут через proxy_pass — без этой строки
# nginx их не сжимает вовсе.
gzip_proxied any;
# 5 — почти то же сжатие, что 9, но заметно дешевле для процессора.
gzip_comp_level 5;
# Мелочь сжимать смысла нет: заголовки съедят выигрыш.
gzip_min_length 1024;
# text/html сжимается всегда, его в списке указывать нельзя (nginx ругнётся
# на повтор). Шрифты woff2 уже сжаты внутри — их тоже не трогаем.
gzip_types
    text/css
    text/plain
    text/javascript
    application/javascript
    application/json
    application/manifest+json
    application/xml
    image/svg+xml;
