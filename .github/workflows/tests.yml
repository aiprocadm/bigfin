# Быстрые проверки: юнит-тесты сервера и фронта плюс парность переводов.
#
# Зачем отдельный процесс. В репозитории есть проверка типов и E2E, но
# юнит-тесты не гонял НИКТО — а именно в них живут машинные сторожа проекта:
# недостижимые страницы, ручки, перекрытые параметрическим маршрутом, форматы
# дат, стражи модулей за флагом, сходимость журнала, ошибки подписчиков
# журнала и склада. Без этого процесса они срабатывают только у того, кто
# вручную запустил тесты у себя.
#
# Процесс намеренно лёгкий: ни базы, ни браузера. Тяжёлый E2E живёт отдельно
# и запускается вручную.
name: Tests

on:
  # Ручной запуск: пригодился сразу — им проверяли, что процесс вообще
  # работает, не дожидаясь очередной правки.
  workflow_dispatch:
  push:
    branches:
      - main
      - develop
    paths:
      - '**.ts'
      - '**.tsx'
      - '**.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/tests.yml'
  pull_request:
    paths:
      - '**.ts'
      - '**.tsx'
      - '**.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/tests.yml'

defaults:
  run:
    shell: 'bash'

jobs:
  unit:
    name: Юнит-тесты и парность переводов
    runs-on: ubuntu-latest
    # Локально всё вместе идёт около полуминуты; запас — на установку
    # зависимостей. Если процесс упирается в потолок, это само по себе повод
    # разобраться, а не ждать часами.
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          # Только 10: настройки проекта (overrides bcrypt→bcryptjs,
          # supportedArchitectures, allowBuilds) лежат в pnpm-workspace.yaml,
          # а его читает лишь pnpm 10+. На девятке установка падает с
          # ERR_PNPM_LOCKFILE_CONFIG_MISMATCH — файл замков помнит overrides,
          # а взять их девятке неоткуда (карта v72).
          #
          # Версия закреплена точно, а не «10»: с плавающей меткой процесс
          # поставил одиннадцатую, и та не поставила платформенный бинарник
          # `@tailwindcss/oxide` — сборка витрины падала на «Cannot find native
          # binding». На 10.34.4 проверено, что настройки из
          # pnpm-workspace.yaml читаются целиком.
          version: 10.34.4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Тесты сервера ввозят общие пакеты из `shared/`; в чистой копии их надо
      # сначала собрать, иначе jest не находит модули (карта v72).
      - name: Сборка общих пакетов
        run: pnpm --filter "@bigfin/utils" --filter "@bigfin/pdf-templates" --filter "@bigfin/email-components" build

      - name: Server unit tests
        run: pnpm --filter @bigfin/server test

      - name: Webapp unit tests
        run: pnpm --filter @bigfin/webapp test:run

      - name: Переводы en↔ru парные
        run: node packages/webapp/scripts/lang-check.js
