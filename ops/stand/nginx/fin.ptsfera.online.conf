# Тестовый стенд bigfin на fin.ptsfera.online. См. docs/RUNBOOK_TEST_STAND.md.
# Ставится в /etc/nginx/sites-available/, включается симлинком в sites-enabled/.
#
# Витрина — собранная статика (packages/webapp/dist), отдаёт сам nginx.
# Сервер — NestJS на 127.0.0.1:3020, туда уходит всё, что начинается с /api.
#
# Это состояние ДО выпуска сертификата. Certbot допишет блоки HTTPS (443) и
# редирект с 80 — после этого файл нельзя перезаписывать целиком, только точечно
# править (иначе дописанное certbot пропадёт и HTTPS отвалится).

server {
    listen 80;
    listen [::]:80;
    server_name fin.ptsfera.online;

    # Realm ТОЛЬКО ЛАТИНИЦЕЙ: по RFC 7230/7235 в значении заголовка допустим
    # лишь ASCII. С кириллицей Chrome и Яндекс.Браузер молча отказываются
    # показать окно пароля — сайт просто не открывается, хотя curl и внешние
    # проверялки исправно получают 401 и всё выглядит здоровым.
    #
    auth_basic "Test stand";
    auth_basic_user_file /etc/nginx/.htpasswd-stand;

    # Загрузка вложений и импорт выписок.
    client_max_body_size 100m;

    # Робот Let's Encrypt должен приходить без пароля, иначе сертификат
    # не выпустится и не продлится через 3 месяца.
    location ^~ /.well-known/acme-challenge/ {
        auth_basic off;
        root /var/www/html;
    }

    # --- Сервер ---
    # auth_basic off здесь ОБЯЗАТЕЛЕН. У витрины ДВА http-клиента:
    # services/axios.tsx кладёт токен в свой заголовок x-access-token, а
    # hooks/useRequest.tsx — в стандартный Authorization: Bearer. Второй
    # вытесняет пропуск basic-auth из браузера (карман один), nginx отвечает
    # 401 с WWW-Authenticate, и окно пароля выскакивает снова и снова —
    # пользоваться стендом невозможно.
    #
    # Сервер защищён своей авторизацией: без токена /api отдаёт 401
    # (JSON, без WWW-Authenticate — окна пароля от него не будет).
    location /api/ {
        auth_basic off;
        proxy_pass http://127.0.0.1:3020;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Сборка базы новой организации и отчёты бывают долгими.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # --- Витрина ---
    # Путь ведёт в ОТДЕЛЬНУЮ копию репозитория под стенд, а не в папку разработки.
    #
    # nginx работает от www-data и должен пройти в /home/aiproc. Домашний каталог
    # обычно drwxr-x---, поэтому нужен `sudo chmod o+x /home/aiproc` (право прохода
    # без листинга). Пакета acl на сервере нет, setfacl недоступен.
    root /home/aiproc/stands/bigfin/packages/webapp/dist;
    index index.html;

    # Файлы с отпечатком в имени (assets/index-a1b2c3.js) не меняются никогда —
    # разрешаем браузеру держать их у себя долго.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Приложение рисует страницы само, поэтому любой неизвестный адрес надо
    # отдавать index.html, а не 404 — иначе перезагрузка страницы ломается.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
