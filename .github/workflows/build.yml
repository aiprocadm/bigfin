# Сборка продукта — та проверка, которой не было.
#
# Зачем отдельный процесс. Проверка типов пропускает целые файлы: реестр
# привязок поиска помечен `@ts-nocheck`, и опечатка в имени ввезённой
# привязки прошла мимо неё, мимо тестов и мимо ревью. Поймал её только
# стенд — обновление откатилось, и стенд встал на старой версии.
#
# Сборка ловит такое сразу: rollup не находит экспорт и падает. Процесс
# намеренно отдельный от «Tests»: тот держат лёгким (ни базы, ни браузера),
# а сборка идёт минуты и работает параллельно.
name: Build

on:
  push:
    branches:
      - main
      - develop
    paths:
      - '**.ts'
      - '**.tsx'
      - '**.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - '**.ts'
      - '**.tsx'
      - '**.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/build.yml'

defaults:
  run:
    shell: 'bash'

jobs:
  build:
    name: Продукт собирается
    runs-on: ubuntu-latest
    # Локально сервер собирается около минуты, витрина — около полутора.
    # Запас — на установку зависимостей.
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          # Только 10: настройки проекта (overrides bcrypt→bcryptjs,
          # supportedArchitectures, allowBuilds) лежат в pnpm-workspace.yaml,
          # а его читает лишь pnpm 10+. На девятке установка падает с
          # ERR_PNPM_LOCKFILE_CONFIG_MISMATCH — файл замков помнит overrides,
          # а взять их девятке неоткуда (карта v72).
          #
          # Версия закреплена точно, а не «10»: с плавающей меткой процесс
          # поставил одиннадцатую, и та не поставила платформенный бинарник
          # `@tailwindcss/oxide` — сборка витрины падала на «Cannot find native
          # binding». На 10.34.4 проверено, что настройки из
          # pnpm-workspace.yaml читаются целиком.
          version: 10.34.4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Собираем корневыми скриптами, а не `--filter @bigfin/server`: сервер и
      # витрина ввозят общие пакеты из `shared/`, и в чистой копии тех ещё нет.
      # `build:server` и `build:webapp` собирают их в правильном порядке
      # (карта v72).
      - name: Сборка сервера
        run: pnpm build:server

      - name: Сборка витрины
        run: pnpm build:webapp

      # Бюджет скорости R24 (этап 55 ТЗ-4): сколько весит сборка до первого
      # экрана, вся и самым крупным куском. Порог в самом скрипте и может
      # только уменьшаться — сравнение с тем же файлом в develop, поэтому
      # его и подтягиваем (без него сторож проверит только порог).
      - name: Бюджет размера сборки
        run: |
          git fetch --depth=1 origin develop:refs/remotes/origin/develop || true
          node scripts/bundle-budget.mjs

      # Витрина историй (Storybook) собирается здесь, а не отдельным потоком:
      # зависимости уже поставлены, а сама сборка занимает около трёх минут.
      #
      # Вопрос «почему её нет в проверках» стоял с карты v80. Ответ оказался
      # простым: она **не собиралась вовсе**, по двум причинам (карта v84):
      #   — у четырёх компонентов имя для отладчика содержало «@» и косые черты
      #     (`@bigfin/Box`), а генератор описаний подставляет имя прямо в код;
      #   — из `vite.config.mts` в сборку историй приезжал плагин совместимости
      #     со старыми браузерами, а с его целями не собирается `chai`.
      #
      # Обе причины устранены. Зачем проверка: истории — единственное место,
      # где живут примитивы оформления, и сборка продукта их не трогает.
      #
      # Памяти узлу — явно. На develop сборка историй после карты v84 упала с
      # «JavaScript heap out of memory» (прогон 34356478391), хотя тот же
      # коммит в проверке PR собрался за восемь минут до того: у сборщика
      # историй потребление на грани умолчания Node, и исход зависит от
      # раннера (карта v85).
      - name: Сборка витрины историй
        run: pnpm --filter @bigfin/webapp build-storybook
        env:
          NODE_OPTIONS: --max-old-space-size=4096
