name: TypeCheck

on:
  push:
    branches:
      - main
      - develop
    paths:
      - '**.ts'
      - '**.tsx'
      - '**/tsconfig.json'
      - '**/tsconfig.*.json'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - 'packages/*/package.json'
      - 'shared/*/package.json'
      - '.github/workflows/typecheck.yml'
  pull_request:
    paths:
      - '**.ts'
      - '**.tsx'
      - '**/tsconfig.json'
      - '**/tsconfig.*.json'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - 'packages/*/package.json'
      - 'shared/*/package.json'
      - '.github/workflows/typecheck.yml'

defaults:
  run:
    shell: 'bash'

jobs:
  typecheck:
    name: TypeScript Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          # Только 10: настройки проекта (overrides bcrypt→bcryptjs,
          # supportedArchitectures, allowBuilds) лежат в pnpm-workspace.yaml,
          # а его читает лишь pnpm 10+. На девятке установка падает с
          # ERR_PNPM_LOCKFILE_CONFIG_MISMATCH — файл замков помнит overrides,
          # а взять их девятке неоткуда (карта v72).
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm run build --scope "@bigfin/utils" --scope "@bigfin/email-components" --scope "@bigfin/pdf-templates"

      - name: Run TypeScript type check
        run: pnpm run typecheck
